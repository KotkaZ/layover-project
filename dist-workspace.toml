# How the `layover` binary is distributed.
#
# `cargo install` needs a Rust toolchain, which is a steep ask for a tool whose users are mostly
# installing Node-based agent CLIs. `dist` builds the binaries and generates installers that need
# neither Rust nor Node: a shell one-liner, a PowerShell one-liner, and an npm package for the
# many users who already have Node because that is how Claude Code, Copilot CLI and Codex CLI
# ship.
#
# Regenerate .github/workflows/release.yml with `dist init` after changing anything here. That
# file is generated and carries a header saying so; `dist plan` checks this config without
# releasing anything.
#
# `dist init` also rewrites the comments below with its own boilerplate. Put them back — the
# defaults it writes say *what* each key is, which the key already says, and not *why* this
# project chose the value it did.
#
# Do not hand-edit the generated workflow. `dist host` verifies it against what `dist` would
# generate and refuses if they differ, which fails the release rather than the check.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
cargo-dist-version = "0.32.0"

# Only the binary is shipped. layover-core and layover-http are libraries, and xtask is
# `publish = false`, so none of them produce an artifact.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

installers = ["shell", "powershell", "npm"]

# Published under a scope so the unscoped name stays free, and because `npx @layover/cli` reads
# as clearly a scoped tool rather than a squatted word.
npm-scope = "@layover"

ci = "github"
pr-run-mode = "plan"
install-updater = false

# Every artifact is checksummed, and the installers verify before unpacking.
checksum = "sha256"

# Signed provenance for every artifact, so a download can be traced to the commit and the workflow
# run that produced it. A checksum says a file was not altered in transit; it says nothing about
# where the file came from — which is the question that matters when the answer is "a binary that
# will run agent CLIs on your machine".
github-attestations = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
