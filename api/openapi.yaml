# The Layover HTTP surface.
#
# This file is the contract, not a description of one. `cargo xtask generate-api` turns it into
# crates/layover-http/src/generated.rs, and `cargo xtask verify` fails when that file is out of
# date, so the server cannot drift away from the spec.
#
# The generator understands a deliberate subset of OpenAPI — see xtask/src/openapi/mod.rs. It
# fails loudly on anything outside that subset rather than silently ignoring it, so this file
# cannot quietly grow constructs the server does not implement. It also refuses any schema,
# property or parameter with no `description`: this document is what the published documentation
# is built from, so an undescribed field here is an undescribed field everywhere.

openapi: 3.2.0

info:
  title: Layover Tower API
  version: 0.23.1
  summary: Control surface for a local-first agent factory.
  description: |
    The UI is purely a client of this API, so this document bounds what the UI can ever do.

    Everything is local-first and unauthenticated by default: the Tower binds to loopback. Do not
    expose it without putting something in front of it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://127.0.0.1:7878
    description: The default local Tower.

tags:
  - name: factory
    summary: What the factory is made of.
  - name: work
    summary: Starting and observing work.
  - name: control
    summary: Stopping everything.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness, version and whether a Ground Stop is engaged.
      tags: [control]
      responses:
        "200":
          description: The Tower is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /agents:
    get:
      operationId: listAgents
      summary: Every configured agent and the route map between them.
      description: |
        This is the UI's graph view, and it is also how a human answers "what can talk to what"
        without reading the TOML.
      tags: [factory]
      responses:
        "200":
          description: The factory's agents and edges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"

  /pipelines:
    get:
      operationId: listPipelines
      summary: Every declared pipeline, its trigger and the flags it accepts.
      tags: [factory]
      responses:
        "200":
          description: The declared pipelines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineList"

  /flights:
    get:
      operationId: listPending
      summary: Flights waiting for something to dispatch them.
      description: |
        Work that has been asked for and not yet started. Until the supervisor exists this is
        everything anybody has triggered; afterwards it is the backlog.
      tags: [work]
      responses:
        "200":
          description: Queued flights, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingList"
    post:
      operationId: sendFlight
      summary: Start work by sending the first flight of a new itinerary.
      description: |
        Give either a `pipeline` or a `to`. A pipeline is the normal way in: it names the entry
        agent and declares which flags may be set. A bare `to` sends to an agent marked
        `entry = true` and accepts no flags.

        **The flight is queued, not run.** Dispatching it needs the supervisor, which is not part
        of this release, so `202` means the work is booked and durable — it will start when there
        is something to start it. `GET /flights` shows what is waiting.
      tags: [work]
      requestBody:
        required: true
        description: What to run, and with which flags.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFlightRequest"
      responses:
        "202":
          description: The flight was accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlightAccepted"
        "400":
          description: The request named an unknown pipeline, agent or flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A Ground Stop is engaged, so no new work may start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /flights/{flight_id}:
    delete:
      operationId: cancelFlight
      summary: Take a queued flight back off the queue.
      description: |
        Only work that has not started can be cancelled. A run that is already going is stopped
        with a Ground Stop, which is a different decision with a different blast radius — one
        flight versus the whole factory — and conflating them would make the smaller action feel
        as dangerous as the larger one.
      tags: [control]
      parameters:
        - name: flight_id
          in: path
          required: true
          description: Identifier of the queued flight.
          schema:
            type: string
      responses:
        "200":
          description: |
            It was queued and is not any more. The body is what is still waiting, so a dashboard
            can show the result of the cancellation without a second request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingList"
        "404":
          description: Nothing by that identifier is waiting. It may already have started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /itineraries:
    get:
      operationId: listItineraries
      summary: Chains of work, and what became of each.
      description: |
        A run is one agent doing one thing; an itinerary is the whole causal chain and the budget
        it shares. The distinction matters most when something goes wrong: a chain can be *stalled*
        — every run in it succeeded and nothing will ever happen again — and a list of runs cannot
        show that, because there is no failed run to point at.
      tags: [work]
      parameters:
        - name: window
          in: query
          required: false
          description: |
            How far back to look. Defaults to the last 24 hours, because a dashboard opening on
            ninety days of chains is answering a question nobody asked.
          schema:
            $ref: "#/components/schemas/CostWindow"
        - name: state
          in: query
          required: false
          description: Only chains in this state.
          schema:
            $ref: "#/components/schemas/ItineraryState"
      responses:
        "200":
          description: Chains, most recent first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryList"

  /runs:
    get:
      operationId: listRuns
      summary: Runs, live and historical.
      tags: [work]
      parameters:
        - name: status
          in: query
          required: false
          description: Return only runs in this state.
          schema:
            $ref: "#/components/schemas/RunStatus"
        - name: itinerary_id
          in: query
          required: false
          description: Return only runs belonging to this itinerary.
          schema:
            type: string
        - name: agent
          in: query
          required: false
          description: Return only runs of this agent.
          schema:
            type: string
        - name: pipeline
          in: query
          required: false
          description: Return only runs whose chain was started by this pipeline.
          schema:
            type: string
        - name: window
          in: query
          required: false
          description: |
            How far back to look. Defaults to the last 24 hours, because a dashboard opening on
            ninety days of history is answering a question nobody asked.
          schema:
            $ref: "#/components/schemas/CostWindow"
        - name: limit
          in: query
          required: false
          description: Maximum number of runs to return, newest first.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Matching runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"

  /graph:
    get:
      operationId: getGraph
      summary: The route map as a diagram, with what is happening drawn on it.
      description: |
        Mermaid source, generated from the configuration as it is on disk right now. Edit
        `layover.toml` and reload; the diagram changes with it, because nothing here is baked at
        build time.

        Agents currently running, waiting at a barrier, or freshly failed are coloured. An edge
        into a joined agent from a sender the barrier does not name is drawn as bypassing it,
        which is what actually happens.
      tags: [structure]
      parameters:
        - name: pipeline
          in: query
          required: false
          description: |
            Draw only what this pipeline sets in motion. Omit for the whole factory.

            A factory holds several pipelines and they are genuinely separate workflows — a
            nightly sweep has nothing to do with taking a work item to a pull request. Drawn
            together they read as one very confused process. An agent belonging to two workflows
            appears in both, which is the honest answer.
          schema:
            type: string
      responses:
        "200":
          description: The diagram.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteMap"

  /runs/{run_id}:
    get:
      operationId: getRun
      summary: One run, including how it ended.
      tags: [work]
      parameters:
        - name: run_id
          in: path
          required: true
          description: Identifier of the run to fetch.
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          description: No such run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /runs/{run_id}/report:
    get:
      operationId: getReport
      summary: What the agent wrote about this run.
      description: |
        A transcript is not a report: it contains every approach the agent abandoned, and reading
        one to find out what happened is slower than doing the work again. This is the agent''s own
        account of what it concluded.
      tags: [work]
      parameters:
        - name: run_id
          in: path
          required: true
          description: Identifier of the run.
          schema:
            type: string
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: No such run, or it wrote no report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /runs/{run_id}/stream:
    get:
      operationId: streamRun
      summary: Live output from a run, as server-sent events.
      tags: [work]
      parameters:
        - name: run_id
          in: path
          required: true
          description: Identifier of the run to stream.
          schema:
            type: string
      responses:
        "200":
          description: A stream of output lines, ending when the run exits.
          content:
            text/event-stream:
              schema:
                type: string
                description: One output line per event.
        "404":
          description: No such run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /costs:
    get:
      operationId: getCosts
      summary: What the factory has spent, and how much of that is measured.
      description: |
        A single Fuel figure says whether a chain may continue. This says where the money went —
        per agent, per model — and, critically, how much of the total the runners actually
        reported rather than Layover inferring it from a rate card.

        Treat `confidence` as part of the number. A total that is mostly measured is still not
        measured, so any estimated or unreported run downgrades the whole figure.
      tags: [work]
      parameters:
        - name: window
          in: query
          required: false
          description: |
            The period to total over. Defaults to the last 30 days.

            Note that `today` and `month_to_date` are *calendar* windows and the rest are *rolling* ones.
            A rolling window is the same length everywhere; a calendar one begins at local
            midnight and therefore depends on where the Tower is standing. The response says
            which zone was used, so the figure can be read without having to guess.
          schema:
            $ref: "#/components/schemas/CostWindow"
        - name: pipeline
          in: query
          required: false
          description: |
            Narrow the totals, the per-agent and the per-model breakdowns to one workflow.

            `reserve` is deliberately unaffected. The Reserve caps the whole factory, so reporting
            it against one workflow's spend would describe a rail that does not exist.
          schema:
            type: string
      responses:
        "200":
          description: The cost breakdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostReport"

  /help:
    get:
      operationId: listHelp
      summary: What agents are stuck on.
      description: |
        A lights-out factory's worst failure is not a crash — a crash is loud. It is an agent that
        quietly cannot do what it was asked, produces something plausible anyway, and passes it
        downstream. This is the channel that stops that being invisible.

        Measured against a working prototype, five of six requests were permission or access
        failures, so `access` is worth filtering for first.
      tags: [work]
      parameters:
        - name: agent
          in: query
          required: false
          description: Only requests from this agent.
          schema:
            type: string
        - name: pipeline
          in: query
          required: false
          description: Only requests raised by a run of this workflow.
          schema:
            type: string
        - name: blocker
          in: query
          required: false
          description: Only requests of this kind.
          schema:
            $ref: "#/components/schemas/Blocker"
        - name: open
          in: query
          required: false
          description: Only requests nobody has dealt with yet.
          schema:
            type: boolean
        - name: window
          in: query
          required: false
          description: How far back to look. Defaults to the last 30 days.
          schema:
            $ref: "#/components/schemas/CostWindow"
      responses:
        "200":
          description: Matching requests, most recent first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpList"

  /help/resolve:
    post:
      operationId: resolveHelp
      summary: Mark help requests as dealt with.
      description: |
        Resolving says *the blocker is gone*, not *I have read this*. An agent that raises the same
        problem on its next run will raise it again, which is the point: a list that clears itself
        on being looked at stops being evidence of anything.

        Narrow by agent, blocker or run. An empty body resolves every open request in the window,
        which is what you want after fixing something that stopped everything.
      tags: [control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveHelpRequest"
      responses:
        "200":
          description: How many were resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpResolved"

  /learnings:
    get:
      operationId: listLearnings
      summary: What agents have worked out, and how well established it is.
      description: |
        A learning applies as soon as it is proposed and expires unless later runs arrive at it
        independently. There is no approval queue, deliberately: a sibling project built one and
        after 22 days held 88 learnings, none ever approved, so not one had ever reached a run.

        A learning becomes permanent through independent rediscovery, which is evidence, rather
        than through its `impact` rating, which is the agent's own claim about its own work.
      tags: [work]
      parameters:
        - name: agent
          in: query
          required: false
          description: Only learnings belonging to this agent.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Only learnings in this state.
          schema:
            $ref: "#/components/schemas/LearningState"
      responses:
        "200":
          description: Matching learnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningList"

  /learnings/{learning_id}:
    patch:
      operationId: judgeLearning
      summary: Settle a learning, either way.
      description: |
        **This is not an approval queue.** A learning applies from the moment it is proposed, and
        nothing is waiting on you. A sibling project gated learnings behind approval and after 22
        days held 88 of them, none ever approved, so not one had ever reached a run.

        This is the override. `confirmed` means "this is real, keep it indefinitely" and spares it
        from lapsing. `rejected` means "this is wrong, stop applying it" and takes it out of every
        future run. Both are judgements a person makes about something already in use, not
        permission for it to start being used.
      tags: [control]
      parameters:
        - name: learning_id
          in: path
          required: true
          description: Identifier of the learning.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeLearningRequest"
      responses:
        "200":
          description: The learning as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learning"
        "404":
          description: No learning by that identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"

  /ground-stop:
    post:
      operationId: engageGroundStop
      summary: Halt everything.
      description: |
        Ground Stop is a file on disk rather than in-memory state, so it survives a Tower crash
        and can be set by hand when nothing else is responding.
      tags: [control]
      responses:
        "200":
          description: Everything is halted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundStop"
    delete:
      operationId: releaseGroundStop
      summary: Resume.
      tags: [control]
      responses:
        "200":
          description: Work may start again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroundStop"

components:
  schemas:
    Status:
      type: string
      description: Liveness of the Tower itself.
      enum: [ok]

    Health:
      type: object
      description: Whether the Tower is up and whether it is allowed to do anything.
      required: [status, version, ground_stop]
      properties:
        status:
          $ref: "#/components/schemas/Status"
          description: Always `ok`; failure is signalled by not answering at all.
        version:
          type: string
          description: The Tower's own version.
        ground_stop:
          type: boolean
          description: True when a Ground Stop is engaged and no new work may start.

    Access:
      type: string
      description: Whether an agent writes to the shared workspace or gets a snapshot.
      enum: [read-only, read-write]

    Join:
      type: string
      description: The condition under which a rendezvous barrier releases.
      enum: [all, any]

    Agent:
      type: object
      description: One configured agent.
      required: [name, access, entry, resident]
      properties:
        name:
          type: string
          description: The key the agent is declared under, and what routes refer to.
        description:
          type: [string, "null"]
          description: One line saying what the agent is.
        purpose:
          type: [string, "null"]
          description: A longer statement of when to route work here.
        runner:
          type: [string, "null"]
          description: Which runner invokes this agent's CLI.
        model:
          type: [string, "null"]
          description: Model identifier passed to the runner.
        access:
          $ref: "#/components/schemas/Access"
          description: Whether the agent writes to the shared workspace.
        entry:
          type: boolean
          description: Whether a human may send flights straight to this agent.
        resident:
          type: boolean
          description: Whether the agent is pinned resident rather than transient.

    Route:
      type: object
      description: One entry of the route map, possibly expanding to several edges.
      required: [from, to]
      properties:
        from:
          type: array
          description: Sending agents.
          items:
            type: string
            description: An agent name.
        to:
          type: array
          description: Receiving agents.
          items:
            type: string
            description: An agent name.
        join:
          $ref: "#/components/schemas/Join"
          description: Set when flights on this edge are parked at a rendezvous barrier.
        timeout_sec:
          type: [integer, "null"]
          format: int64
          description: Backstop for a barrier that never completes.

    AgentList:
      type: object
      description: The factory's agents and the edges between them.
      required: [agents, routes]
      properties:
        agents:
          type: array
          description: Every configured agent.
          items:
            $ref: "#/components/schemas/Agent"
        routes:
          type: array
          description: The route map.
          items:
            $ref: "#/components/schemas/Route"

    TriggerKind:
      type: string
      description: Whether a human or a clock starts a pipeline.
      enum: [manual, scheduled]

    Trigger:
      type: object
      description: What starts a pipeline.
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/TriggerKind"
          description: Whether a human or a clock starts this pipeline.
        every_seconds:
          type: [integer, "null"]
          format: int64
          description: Set when the pipeline fires on a fixed interval.
        cron:
          type: [string, "null"]
          description: Set when the pipeline fires on a five-field cron expression.

    Flag:
      type: object
      description: A boolean parameter a pipeline accepts at trigger time.
      required: [name, default]
      properties:
        name:
          type: string
          description: The name a prompt tests with `@include(name)`.
        description:
          type: [string, "null"]
          description: What turning this flag on actually does.
        default:
          type: boolean
          description: Value used when the trigger does not set the flag.

    FlagValue:
      type: object
      description: >
        A flag resolved to the value one run will see. Distinct from `Flag`, which declares what
        a pipeline accepts: a declaration carries a default, and reporting that default back as
        though it were the operator's choice would hide the difference between a flag left alone
        and a flag deliberately set to the same value.
      required: [name, value]
      properties:
        name:
          type: string
          description: The name a prompt tests with `@include(name)`.
        value:
          type: boolean
          description: The value this run will see.

    Workspace:
      type: string
      description: |
        Whether instances of one pipeline share a working directory or get one each. A schedule
        fires whether or not the last instance finished, so anything reaching a read-write agent
        wants its own.
      enum: [shared, per-itinerary]

    Pipeline:
      type: object
      description: A named entry point into the mesh.
      required: [name, entry, trigger, flags, max_hops, fuel_usd, workspace, resumes]
      properties:
        name:
          type: string
          description: The key the pipeline is declared under.
        description:
          type: [string, "null"]
          description: One line saying what this pipeline is for.
        entry:
          type: string
          description: The agent that receives the first flight.
        trigger:
          $ref: "#/components/schemas/Trigger"
          description: What starts it.
        max_hops:
          type: integer
          format: int32
          description: |
            Flights a chain started here may make before it is cut. Bounds **depth**: branches
            inherit the remaining count rather than splitting it, so this says nothing about how
            wide a fan-out spreads.
        fuel_usd:
          type: number
          format: double
          description: |
            Shared budget for a chain started here, honouring the entry agent's own `fuel_usd`
            where it sets one. Bounds **breadth**, which is the dimension Hops cannot see.
        workspace:
          $ref: "#/components/schemas/Workspace"
          description: |
            Whether instances of this pipeline share a working directory or get one each. A
            schedule fires whether or not the last instance finished, so anything reaching a
            read-write agent wants its own.
        resumes:
          type: boolean
          description: |
            True when this pipeline picks up booked layovers rather than starting fresh work. A
            tick that finds nothing due costs nothing.
        flags:
          type: array
          description: The boolean parameters this pipeline accepts.
          items:
            $ref: "#/components/schemas/Flag"

    PipelineList:
      type: object
      description: Every declared pipeline.
      required: [pipelines]
      properties:
        pipelines:
          type: array
          description: The pipelines.
          items:
            $ref: "#/components/schemas/Pipeline"

    SendFlightRequest:
      type: object
      description: |
        Exactly one of `pipeline` and `to` must be given, and flags are only accepted alongside a
        pipeline, because a pipeline is what declares them.

        Neither is marked required here because JSON Schema cannot state "exactly one of these"
        in a way this generator supports. The Tower enforces it and answers `400` — so a client
        that satisfies this schema can still be rejected.
      required: [body]
      properties:
        pipeline:
          type: [string, "null"]
          description: Name of the pipeline to start.
        to:
          type: [string, "null"]
          description: Name of an `entry = true` agent to send to directly.
        body:
          type: string
          description: What the receiving agent is being asked to do.
        flags:
          type: object
          description: Flag overrides, keyed by flag name. Unset flags take their declared default.
          additionalProperties:
            type: boolean
            description: Whether the flag is on.

    FlightAccepted:
      type: object
      description: Confirmation that work has been started.
      required: [flight_id, itinerary_id, to]
      properties:
        flight_id:
          type: string
          description: Identifier of the flight that was created.
        itinerary_id:
          type: string
          description: Identifier of the new chain, which carries Hops and Fuel.
        to:
          type: string
          description: The agent the flight was addressed to.

    RunStatus:
      type: string
      description: |
        How a run ended, or that it has not.

        `halted` is deliberately distinct from `failed`: a rail stopping work — Hops, Fuel, the
        run cap or the Reserve — is the system doing its job, and colouring it like a crash
        teaches people to ignore the colour. `interrupted` means the run was alive when the Tower
        went away; it is recoverable, and recovery starts a new run rather than resuming this one.

        There is no `stalled` here. Stalling is something an *itinerary* does when it parks at a
        barrier that never releases; a run either finishes or does not.
      enum: [running, succeeded, failed, timed_out, halted, interrupted]

    Run:
      type: object
      description: One supervised CLI execution.
      required: [run_id, itinerary_id, agent, status, started_at, cost_source]
      properties:
        run_id:
          type: string
          description: Identifier of this run.
        itinerary_id:
          type: string
          description: The chain this run belongs to.
        agent:
          type: string
          description: Which agent was run.
        pipeline:
          type: [string, "null"]
          description: The pipeline that started this run's chain, when one did.
        model:
          type: [string, "null"]
          description: Which model the runner used, when it said.
        status:
          $ref: "#/components/schemas/RunStatus"
          description: How it ended, or that it has not.
        started_at:
          type: string
          format: date-time
          description: When the process was spawned.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the process exited; null while it is still running.
        duration_sec:
          type: [integer, "null"]
          format: int64
          description: |
            How long the run took. Null while it is still going, and also null if the clock moved
            backwards between the two readings — a negative duration on a dashboard is worse than
            an absent one, because somebody will average it.
        exit_code:
          type: [integer, "null"]
          format: int32
          description: Process exit code, when there was one.
        cost_usd:
          type: [number, "null"]
          format: double
          description: Null when the runner reported no cost, which the Tower logs loudly.
        cost_source:
          $ref: "#/components/schemas/CostSource"
          description: Where `cost_usd` came from.
        detail:
          type: [string, "null"]
          description: Why the run ended, for the outcomes where that is not self-evident.
        blocked_on:
          type: [string, "null"]
          description: |
            What the run could not get past, when it asked for help. Independent of `status`: an
            agent can finish its task and still have been unable to check something. Without it a
            blocked run looks exactly like a clean one on a list.
        hops_remaining:
          type: [integer, "null"]
          format: int32
          description: Hops left when this run was started, mirrored for display only.

    RunList:
      type: object
      description: Matching runs, newest first.
      required: [runs]
      properties:
        runs:
          type: array
          description: The runs.
          items:
            $ref: "#/components/schemas/Run"

    CostSource:
      type: string
      description: |
        Where a cost figure came from, worst-first. `reported` is the only kind worth billing
        against; `rate_card` was derived from token counts and published prices; `unreported`
        means the runner said nothing, so the figure is zero and means nothing.
      enum: [reported, rate_card, unreported]

    TokenUsage:
      type: object
      description: |
        Tokens consumed. Cached reads and writes are counted apart from fresh input because
        providers price them very differently, and blending them makes any derived cost wrong by
        whatever the cache hit rate happened to be.
      required: [input, output, cache_read, cache_write]
      properties:
        input:
          type: integer
          format: int64
          description: Prompt tokens billed at the input rate.
        output:
          type: integer
          format: int64
          description: Generated tokens.
        cache_read:
          type: integer
          format: int64
          description: Tokens served from the provider's prompt cache.
        cache_write:
          type: integer
          format: int64
          description: Tokens written into the provider's prompt cache.

    CostSummary:
      type: object
      description: Totals over some set of runs, carrying their own confidence.
      required: [runs, usd, usage, unreported_runs, estimated_runs, confidence, measured_share]
      properties:
        runs:
          type: integer
          format: int32
          description: How many runs contributed.
        usd:
          type: number
          format: double
          description: Total cost in US dollars.
        usage:
          $ref: "#/components/schemas/TokenUsage"
          description: Total tokens.
        unreported_runs:
          type: integer
          format: int32
          description: Runs whose runner reported no cost at all.
        estimated_runs:
          type: integer
          format: int32
          description: Runs priced from a rate card rather than measured.
        confidence:
          $ref: "#/components/schemas/CostSource"
          description: The weakest source contributing to this total.
        measured_share:
          type: number
          format: double
          description: Fraction of runs whose cost the runner actually reported, 0.0 to 1.0.

    Blocker:
      type: string
      description: |
        What kind of thing an agent is stuck on. Coarse on purpose: the point is to make "half my
        runs are stuck on credentials" visible at a glance, with the detail in the prose.
      enum: [access, tooling, ambiguity, environment, decision, other]

    HelpRequest:
      type: object
      description: One agent asking a human for something.
      required: [agent, run_id, itinerary_id, blocker, summary, detail, fatal, at]
      properties:
        agent:
          type: string
          description: Who is asking.
        run_id:
          type: string
          description: The run that raised it.
        itinerary_id:
          type: string
          description: The chain it belonged to.
        pipeline:
          type: [string, "null"]
          description: |
            The workflow whose run raised it, derived from the itinerary rather than stored on the
            request. Null when no run for that itinerary is still in history, which retention can
            cause at the far edge of the window.
        blocker:
          $ref: "#/components/schemas/Blocker"
          description: What kind of thing is in the way.
        summary:
          type: string
          description: One line, for a list.
        detail:
          type: string
          description: What was tried, what happened, and what is needed.
        fatal:
          type: boolean
          description: |
            Whether this stopped the work or merely limited it. An agent can finish its task and
            still have been unable to check something; that is worth reporting and is not an
            outage.
        at:
          type: string
          format: date-time
          description: When it was raised.
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: When a human marked it dealt with. Null while it is still open.

    HelpList:
      type: object
      description: Matching help requests, most recent first.
      required: [requests, open]
      properties:
        requests:
          type: array
          description: The requests.
          items:
            $ref: "#/components/schemas/HelpRequest"
        open:
          type: integer
          format: int32
          description: How many of them nobody has dealt with.

    Impact:
      type: string
      description: |
        How much applying a learning would change a future run. Self-assessed, and therefore used
        for display and triage only — never to decide whether a learning applies.
      enum: [low, medium, high]

    LearningState:
      type: string
      description: |
        Where a learning is in its life. `provisional` applies now and will lapse unless
        rediscovered; `confirmed` has been rediscovered enough times to be treated as real;
        `lapsed` is remembered only so a later rediscovery can be recognised as one; `rejected`
        was refused by a human and never counts again.
      enum: [provisional, confirmed, lapsed, rejected]

    Learning:
      type: object
      description: Something an agent worked out, with its history.
      required: [id, agent, text, impact, state, proposals, runs_left, first_at, last_at]
      properties:
        id:
          type: string
          description: Identifier.
        agent:
          type: string
          description: The agent this applies to. Learnings do not cross agents.
        text:
          type: string
          description: The insight.
        impact:
          $ref: "#/components/schemas/Impact"
          description: The agent's own rating, for triage.
        state:
          $ref: "#/components/schemas/LearningState"
          description: Where it is in its life.
        proposals:
          type: integer
          format: int32
          description: |
            How many times it has been independently rediscovered, including the first proposal.
            Repeating advice the agent was just shown does not count — an echo is not evidence.
        runs_left:
          type: integer
          format: int32
          description: Runs before it lapses. Meaningless unless `provisional`.
        first_at:
          type: string
          format: date-time
          description: When it was first proposed.
        last_at:
          type: string
          format: date-time
          description: When it was most recently proposed.

    LearningList:
      type: object
      description: Matching learnings.
      required: [learnings, active]
      properties:
        learnings:
          type: array
          description: The learnings.
          items:
            $ref: "#/components/schemas/Learning"
        active:
          type: integer
          format: int32
          description: How many of them are currently given to runs.

    CostWindow:
      type: string
      description: |
        A period to report over.

        Two kinds, and the difference matters. `today` and `month_to_date` are **calendar** windows: they
        begin at local midnight, so which instant that is depends on the Tower's time zone. The
        rest are **rolling**: a fixed number of hours ending now, identical everywhere.

        Conflating the two is not theoretical. Gating spend on a UTC day boundary while reporting
        the ledger in local time lets a factory spend one day's money twice, and the bug is
        invisible until it matters.
      enum: [today, last_24h, last_7d, last_30d, month_to_date, last_90d, all_time]

    WindowSpan:
      type: object
      description: A resolved window, and an honest account of how it was arrived at.
      required: [window, label, calendar, end, truncated]
      properties:
        window:
          $ref: "#/components/schemas/CostWindow"
          description: Which window this is.
        label:
          type: string
          description: A human label, such as "Last 30 days".
        calendar:
          type: boolean
          description: True when the start was reckoned against a local midnight.
        start:
          type: [string, "null"]
          format: date-time
          description: When the period begins. Null means from the beginning of what is kept.
        end:
          type: string
          format: date-time
          description: When the period ends, which is the moment it was resolved.
        zone:
          type: [string, "null"]
          description: |
            The IANA zone the start was reckoned in, or null for a rolling window. The absence is
            the point: nobody should have to wonder which zone "last 7 days" used.
        truncated:
          type: boolean
          description: |
            True when the period reaches further back than retention keeps, which makes the
            totals a lower bound rather than a total.

    PendingFlight:
      type: object
      description: A flight that has been asked for and not yet dispatched.
      required: [flight_id, itinerary_id, to, body, queued_at]
      properties:
        flight_id:
          type: string
          description: Identifier of the queued flight.
        itinerary_id:
          type: string
          description: The chain it will begin.
        to:
          type: string
          description: The agent it is addressed to.
        pipeline:
          type: [string, "null"]
          description: The pipeline it was triggered through, when one was named.
        body:
          type: string
          description: The prompt the run will be given.
        flags:
          type: array
          description: The flags set for this run.
          items:
            $ref: "#/components/schemas/FlagValue"
        queued_at:
          type: string
          format: date-time
          description: When it was asked for.

    ResolveHelpRequest:
      type: object
      description: Which open help requests to mark as dealt with.
      properties:
        agent:
          type: [string, "null"]
          description: Only requests from this agent.
        blocker:
          $ref: "#/components/schemas/Blocker"
          description: Only requests of this kind.
        run_id:
          type: [string, "null"]
          description: |
            Only requests raised by this run. The narrowest form, and the one a list with a button
            beside each row uses.
        window:
          $ref: "#/components/schemas/CostWindow"
          description: How far back to look. Defaults to the last 30 days.

    HelpResolved:
      type: object
      description: The result of resolving.
      required: [resolved]
      properties:
        resolved:
          type: integer
          description: |
            How many open requests were marked. Zero is not an error: somebody else may have
            resolved them, or the narrowing may have matched nothing.

    Judgement:
      type: string
      description: |
        What a person decided about a learning that is already in use.

        There is no `provisional` here. A learning starts provisional on its own and becomes
        confirmed through independent rediscovery; putting one *back* would discard evidence
        already gathered.
      enum: [confirmed, rejected]

    JudgeLearningRequest:
      type: object
      description: A person's verdict on a learning.
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/Judgement"
          description: The verdict.

    ItineraryState:
      type: string
      description: |
        What became of a chain.

        `stalled` is the one that matters and the one a list of runs cannot show: every run
        succeeded, nothing is live, nothing is queued, and nothing will ever happen again. It is
        the failure mode this whole surface exists to make visible.
      enum: [working, finished, stalled, halted]

    Itinerary:
      type: object
      description: One causal chain of flights, and the budget it shares.
      required: [itinerary_id, state, runs, usd, started_at]
      properties:
        itinerary_id:
          type: string
          description: Identifier of the chain.
        pipeline:
          type: [string, "null"]
          description: The pipeline it was triggered through, when one was named.
        state:
          $ref: "#/components/schemas/ItineraryState"
          description: What became of the chain.
        agents:
          type: array
          description: Agents that ran in this chain, in the order they first ran.
          items:
            type: string
        runs:
          type: integer
          description: How many runs the chain has started.
        usd:
          type: number
          format: double
          description: What the chain has spent, as far as its runners reported.
        measured:
          type: boolean
          description: |
            False when any run in the chain reported no cost. A total built partly from silence is
            a floor, not a figure, and showing it as though it were measured invites planning
            against it.
        started_at:
          type: string
          format: date-time
          description: When the first run of the chain began.
        finished_at:
          type: [string, "null"]
          format: date-time
          description: When the last run of the chain ended. Null while it is still working.
        detail:
          type: [string, "null"]
          description: Why a chain is stalled or halted, when that can be said.

    ItineraryList:
      type: object
      description: Chains of work.
      required: [itineraries, stalled]
      properties:
        itineraries:
          type: array
          description: Chains, most recently started first.
          items:
            $ref: "#/components/schemas/Itinerary"
        stalled:
          type: integer
          description: |
            How many of them are stalled. Counted separately so the number can be shown without
            reading the list, because it is the one that should prompt somebody to look.

    PendingList:
      type: object
      description: Work waiting to start.
      required: [pending, dispatched_by]
      properties:
        pending:
          type: array
          description: Queued flights, oldest first.
          items:
            $ref: "#/components/schemas/PendingFlight"
        dispatched_by:
          type: [string, "null"]
          description: |
            What will pick this work up, or null when nothing will. Null is the honest answer
            until the supervisor exists, and the dashboard says so rather than showing a queue
            that looks like it is moving.

    Report:
      type: object
      description: What an agent wrote about its own run.
      required: [run_id, agent, itinerary_id, headline, body, at]
      properties:
        run_id:
          type: string
          description: The run this describes.
        agent:
          type: string
          description: Which agent wrote it.
        itinerary_id:
          type: string
          description: The chain it belonged to.
        headline:
          type: string
          description: One line, for a list. What happened, not what was attempted.
        body:
          type: string
          description: The report itself, as the agent wrote it.
        artifacts:
          type: array
          description: |
            What the run produced or changed — paths, branch names, pull request identifiers.
            Separate from the body so output can be found without reading the prose.
          items:
            type: string
        trimmed:
          type: boolean
          description: |
            True when the report was longer than the cap and was cut. Worth knowing: otherwise it
            reads as though the agent simply stopped there.
        at:
          type: string
          format: date-time
          description: When it was written.

    RouteMap:
      type: object
      description: The factory drawn as a graph.
      required: [mermaid, generated_at]
      properties:
        mermaid:
          type: string
          description: Mermaid `flowchart` source, ready to render.
        generated_at:
          type: string
          format: date-time
          description: When the configuration was read.
        config_path:
          type: [string, "null"]
          description: Which file it was generated from.

    CostBucket:
      type: object
      description: One named slice of spend, such as an agent or a model.
      required: [name, summary]
      properties:
        name:
          type: string
          description: The agent or model this slice belongs to.
        summary:
          $ref: "#/components/schemas/CostSummary"
          description: Totals for this slice.

    ReserveState:
      type: object
      description: |
        The factory-wide spend ceiling. Distinct from Fuel, which bounds one itinerary: a
        scheduled pipeline mints a fresh itinerary with a fresh Fuel budget on every tick, so
        only the Reserve bounds the total. The window rolls rather than resetting at midnight.
      required: [spent_usd, window_hours, exhausted]
      properties:
        cap_usd:
          type: [number, "null"]
          format: double
          description: Ceiling for the window. Null when no ceiling is enforced.
        spent_usd:
          type: number
          format: double
          description: Spend within the current window.
        remaining_usd:
          type: [number, "null"]
          format: double
          description: Left before new work is refused. Null when unlimited.
        window_hours:
          type: integer
          format: int64
          description: How far back the rolling window reaches.
        exhausted:
          type: boolean
          description: True when the Reserve is currently refusing new work.

    CostReport:
      type: object
      description: Where the factory's money went.
      required: [span, total, by_agent, by_model, by_pipeline, reserve]
      properties:
        span:
          $ref: "#/components/schemas/WindowSpan"
          description: |
            The period these totals cover, including the zone it was reckoned in and whether it
            outruns retention. Part of the number, not decoration.
        total:
          $ref: "#/components/schemas/CostSummary"
          description: Totals across every run in scope.
        by_agent:
          type: array
          description: Spend per agent, most expensive first.
          items:
            $ref: "#/components/schemas/CostBucket"
        by_model:
          type: array
          description: Spend per model, most expensive first. Runs with no reported model are omitted.
          items:
            $ref: "#/components/schemas/CostBucket"
        by_pipeline:
          type: array
          description: |
            Spend per workflow, most expensive first. The breakdown a factory with several
            pipelines actually needs: per-agent totals cannot answer "what does the nightly sweep
            cost" once an agent belongs to more than one workflow, and most of them do.
          items:
            $ref: "#/components/schemas/CostBucket"
        reserve:
          $ref: "#/components/schemas/ReserveState"
          description: The factory-wide ceiling and what is left of it.

    GroundStop:
      type: object
      description: Whether everything is halted.
      required: [engaged]
      properties:
        engaged:
          type: boolean
          description: True when no new work may start.
        since:
          type: [string, "null"]
          format: date-time
          description: When the Ground Stop was engaged.

    Problem:
      type: object
      description: An error, shaped after RFC 9457.
      required: [title, status]
      properties:
        title:
          type: string
          description: A short, human-readable summary of the problem.
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated in the body for clients that lose it.
        detail:
          type: [string, "null"]
          description: An explanation specific to this occurrence.
