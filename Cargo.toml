[workspace]
resolver = "3"
members = ["crates/layover-cli", "crates/layover-core", "crates/layover-dashboard", "crates/layover-http", "crates/layover-mcp", "crates/layover-store", "crates/layover-tower", "xtask"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/KotkaZ/layover-project"

[workspace.dependencies]
axum = "0.8"
clap = "4"
tokio = "1"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
ulid = "3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Required by `dist`, which builds releases with `--profile dist`. Its absence is invisible to
# `dist plan` and only surfaces once a tag starts a real build.
[profile.dist]
inherits = "release"
lto = "thin"
