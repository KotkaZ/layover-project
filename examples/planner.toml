# The minimal factory shape documented in docs/architecture.md.
#
# Start here: three agents, one loop, one manual pipeline. For the reference scenario — scheduled
# triggers, conditional prompts and a rendezvous on both ends — see workitem-factory/.
#
# This file is parsed and validated by crates/layover-core/tests/examples.rs, so the documented
# configuration cannot quietly stop being loadable.

[layover]
state_dir  = ".layover/state"
work_dir   = "workspace"
logbook    = ".layover/logbook.md"
prompt_dir = "prompts"
http_addr  = "127.0.0.1:7878"

[defaults]
runner      = "claude"
max_hops    = 8
fuel_usd    = 5.00
max_runs    = 64
timeout_sec = 900

# ── How to invoke each supported CLI ───────────────────────────────
# The composed instructions go to the process on **stdin**, never on the command line: Windows
# caps one at 32,767 characters and real prompts run to tens of kilobytes. A `{prompt}` placeholder
# would be a *path* to that text, for CLIs that take a file — none of these three do.
[runners.claude]
command = ["claude", "-p", "--output-format", "stream-json"]
mcp     = { flag = "--mcp-config", format = "claude_json" }

[runners.copilot]
command = ["copilot", "--allow-all-tools"]
mcp     = { flag = "--mcp-config", format = "claude_json" }

[runners.codex]
command = ["codex", "exec", "-"]
mcp     = { flag = "-c", format = "codex_toml" }

# ── Agents ─────────────────────────────────────────────────────────
[agents.planner]
description = "Breaks incoming goals into concrete tasks and dispatches them"
purpose     = """
Route here when a goal still needs decomposing. The planner is also where rejected work comes
back to, so it decides whether to retry, re-scope or stop.
"""
runner   = "claude"
model    = "claude-opus-4"
resident = false
prompt   = """
You break incoming goals into concrete tasks and dispatch them.
Record durable conclusions with layover_memory_write.
"""

[agents.coder]
description = "Implements the task described in the incoming flight"
runner      = "copilot"
prompt      = "You implement the task described in the incoming flight."

[agents.reviewer]
description = "Approves work or returns concrete defects"
runner      = "codex"
access      = "read-only"
prompt      = "You review work and either approve it or return concrete defects."

# ── Pipelines: how work enters the mesh ────────────────────────────
[pipelines.build]
description = "Turn a goal into reviewed work"
entry       = "planner"
trigger     = "manual"

# ── The route map: directed edges ──────────────────────────────────
[[routes]]
from = "planner"
to   = "coder"

[[routes]]
from = "coder"
to   = "reviewer"

[[routes]]
from = "reviewer"
to   = "planner"
