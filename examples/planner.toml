# Your first factory: three agents, one loop, one manual pipeline.
#
# Every agent runs on GitHub Copilot CLI, the CLI Layover is proven against end to end, so trying it
# needs that one CLI, installed and signed in (`copilot login`), and nothing else. Copy this file
# into an empty directory as `layover.toml` and run `layover serve` there; the agents work in
# `workspace/` beside it, which the Tower creates. Claude Code and Codex runners are shown in
# workitem-factory/ and in the configuration reference.
#
# This file is parsed and validated by crates/layover-core/tests/examples.rs, so the documented
# configuration cannot quietly stop being loadable.

[layover]
work_dir = "workspace"
logbook  = ".layover/logbook.md"

[defaults]
runner      = "copilot"
max_hops    = 8
fuel_usd    = 5.00
max_runs    = 64
timeout_sec = 900
# Recommended before a factory runs for real: a CLI home of its own, so its runs neither fill your
# session history nor load your personal plugins and MCP servers. Set COPILOT_HOME for the Tower,
# sign in once with it set, and uncomment this line. Only the *name* goes here: the Tower reads the
# value from its own environment, so this file stays committable.
# env_from = ["COPILOT_HOME"]

# ── How to invoke the CLI ──────────────────────────────────────────
# For a CLI Layover knows, `cli` is the whole runner: Layover supplies the program, everything an
# unattended run needs, the agent's model and effort, the output a cost is read from and the MCP
# wiring. `args` adds the rest — what every agent on this runner is denied. The composed
# instructions reach the process on stdin, never on the command line.
[runners.copilot]
cli  = "copilot"
args = ["--deny-tool=shell(git push)"]

# ── Agents ─────────────────────────────────────────────────────────
[agents.planner]
description = "Breaks incoming goals into concrete tasks and dispatches them"
purpose     = """
Route here when a goal still needs decomposing. The planner is also where rejected work comes
back to, so it decides whether to retry, re-scope or stop.
"""
effort      = "high"     # its own; the others take the CLI's default, as they take its model
prompt      = """
You break incoming goals into concrete tasks and dispatch them.
Record durable conclusions with layover_memory_write.
"""

[agents.coder]
description = "Implements the task described in the incoming flight"
prompt      = "You implement the task described in the incoming flight."

[agents.reviewer]
description = "Approves work or returns concrete defects"
access      = "read-only"
prompt      = "You review work and either approve it or return concrete defects."

# ── Pipelines: how work enters the mesh ────────────────────────────
[pipelines.build]
description = "Turn a goal into reviewed work"
entry       = "planner"
trigger     = "manual"

# ── The route map: directed edges ──────────────────────────────────
[[routes]]
from = "planner"
to   = "coder"

[[routes]]
from = "coder"
to   = "reviewer"

[[routes]]
from = "reviewer"
to   = "planner"