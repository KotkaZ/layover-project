# Twice a day, find what changed in the world and write it up.
#
# The simplest factory that is still worth running, and a good first one to copy: a schedule, two
# agents, one route.

[layover]
work_dir   = "workspace"
prompt_dir = "prompts"

[defaults]
runner   = "copilot"
# The agent CLI needs its own credential before it can do anything. Only the *name* goes here;
# the Tower reads the value from its own environment at spawn time, so this file stays
# committable. Copilot CLI also accepts COPILOT_GITHUB_TOKEN or GITHUB_TOKEN.
env_from = ["GH_TOKEN"]
max_hops = 4
fuel_usd = 1.50
max_concurrent_runs = 2

[reserve]
fuel_usd     = 10.00
window_hours = 24

# `cli = "copilot"` has Layover supply what every unattended Copilot run needs: the agent's model,
# effort and context, `--allow-all-tools/paths/urls`, `--no-ask-user`, `--output-format json` and
# the MCP wiring. `args` would add what this runner's agents are denied.
[runners.copilot]
cli = "copilot"

[agents.scout]
description = "Reads the news and decides what is actually worth knowing"
purpose     = """
Route here to find out what changed. Reads widely, keeps little. Judges significance, never
writes the final text.
"""
prompt_file = "scout.md"
access      = "read-only"

[agents.mailman]
description = "Writes the digest and posts it"
purpose     = """
Route here with findings that have already been judged worth reporting. Turns them into something
readable and posts it. Does not decide what matters.
"""
prompt_file = "mailman.md"

[pipelines.digest]
description = "A twice-daily digest, at eight and at six"
entry       = "scout"
trigger     = { cron = "0 8,18 * * *" }
# Two instances can never overlap at twelve hours apart, but the mailman writes, so each run is
# meant to get its own worktree anyway. The cost is a checkout; the alternative is a rare corruption
# that only shows up when a schedule changes. Declared, not yet enforced.
workspace   = "per-itinerary"

[pipelines.digest.flags.deep]
description = "Read further back and include second-tier sources"
default     = false

[[routes]]
from = "scout"
to   = "mailman"
