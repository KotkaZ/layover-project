[package]
name = "layover-cli"
description = "Supervise headless agent CLIs, route their messages, and bound what they spend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://kotkaz.github.io/layover-project/"
documentation = "https://kotkaz.github.io/layover-project/"
readme = "README.md"
keywords = ["agents", "orchestration", "llm", "automation", "supervisor"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "layover"
path = "src/main.rs"

# dist names a formula after the crate, which would make this `brew install KotkaZ/tap/layover-cli`
# for a binary called `layover`. The crate is `layover-cli` only because the bare name on crates.io
# belongs to an unrelated SSH tunnelling tool; Homebrew has no such conflict, so the formula gets
# the name the binary actually has.
[package.metadata.dist]
formula = "layover"

[dependencies]
layover-core = { path = "../layover-core", version = "1.15.0" }
clap = { workspace = true, features = ["derive"] }
layover-dashboard = { path = "../layover-dashboard", version = "1.15.0" }
layover-mcp = { path = "../layover-mcp", version = "1.15.0" }
layover-store = { path = "../layover-store", version = "1.15.0" }
layover-tower = { path = "../layover-tower", version = "1.15.0" }
layover-update = { path = "../layover-update", version = "1.15.0" }
layover-http = { path = "../layover-http", version = "1.15.0" }
axum = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros", "signal", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
toml = { workspace = true }
# For the release server the update tests stand up, shared with layover-update's own tests: it
# packs a binary as a release would.
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
lzma-rs = "0.3"
