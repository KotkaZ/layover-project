[package]
name = "layover-dashboard"
description = "The Layover monitoring dashboard: route map, run history and cost, served from the Tower."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
layover-core = { path = "../layover-core", version = "0.18.0" }
layover-http = { path = "../layover-http", version = "0.18.0" }
layover-store = { path = "../layover-store", version = "0.18.0" }
axum = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }

[lints]
workspace = true
