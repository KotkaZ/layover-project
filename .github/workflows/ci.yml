name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Read-only by default. The repository setting happens to default workflow tokens to read-only
# today, but a setting is not a guarantee: stating it here means a change to that setting cannot
# quietly widen what a build script or proc macro in this job could do.
permissions:
  contents: read

jobs:
  verify:
    name: cargo xtask verify
    # Windows is where this project is developed and Linux is where CI runs, so every change is
    # written on one and proved on the other. Both are needed: the supervisor kills process trees
    # and handles signals, which are not the same operation on the two platforms, and a
    # platform-conditional block compiles on exactly the platform its author is not using.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Every action is pinned to a commit. A version tag is mutable, so `@v4` is a promise from
      # whoever can move that tag rather than a description of what will run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Deliberately the same command an agent runs locally. If this workflow
      # ever grows extra steps, a local pass stops implying a CI pass, and an
      # unattended agent can no longer tell whether its work is correct.
      - run: cargo xtask verify
