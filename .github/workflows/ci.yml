name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: cargo xtask verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Deliberately the same command an agent runs locally. If this workflow
      # ever grows extra steps, a local pass stops implying a CI pass, and an
      # unattended agent can no longer tell whether its work is correct.
      - run: cargo xtask verify
