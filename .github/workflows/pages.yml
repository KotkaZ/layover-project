name: Pages

# The site's root is the latest release's book, so what a reader is told matches the Layover they
# can install; main is published beside it at /dev/, marked as unreleased on every page. A release
# is published by the Release workflow with the workflow's own token, which starts no other
# workflow, so that workflow finishing is what rebuilds the root.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

# The build job only needs to read the repository. Deploying is what needs `pages: write` and
# OIDC, so those are granted to the deploy job alone — the build job installs and runs mdBook,
# and an install step should not also be able to publish a site.
permissions:
  contents: read

# A newer deploy always wins, but never cancel one mid-flight: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the book
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a version tag is mutable. Always main, whatever started the run, with
      # its tags, so the latest release can be checked out beside it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install mdBook
        run: |
          cargo install mdbook --version =0.4.52 --locked
          cargo install mdbook-mermaid --version =0.15.0 --locked

      - name: Check out the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "Latest release: $tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          git worktree add --detach release "$tag"

      # The release's book at the root, then main's at /dev/ — in that order, because mdBook empties
      # the directory it builds into. A book that lists design pages has them written from docs/
      # first, by main's xtask, linking code at the commit being published. The book includes
      # example configurations by path, so a renamed one fails here rather than publishing a page
      # with a dangling include.
      - name: Build
        run: |
          build() {
            tree=$1; ref=$2; out=$3; url=$4; js=$5
            if grep -q '](./design/' "$tree/book/src/SUMMARY.md"; then
              cargo run --quiet -p xtask -- book --root "$tree" --ref "$ref"
            fi
            mdbook-mermaid install "$tree/book"
            env "MDBOOK_OUTPUT__HTML__SITE_URL=$url" \
              ${js:+"MDBOOK_OUTPUT__HTML__ADDITIONAL_JS=$js"} \
              mdbook build "$tree/book" --dest-dir "$out"
          }
          build "$GITHUB_WORKSPACE/release" "$RELEASE_TAG" "$GITHUB_WORKSPACE/site" /layover-project/ ""
          build "$GITHUB_WORKSPACE" main "$GITHUB_WORKSPACE/site/dev" /layover-project/dev/ \
            '["mermaid.min.js","mermaid-init.js","design-edit-links.js","dev-banner.js"]'

      # Since v4 this leaves out dotfiles, which drops mdBook's `.nojekyll`. That is harmless:
      # a site deployed from a workflow is served as built and never goes through Jekyll.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Here rather than in the build job, because enabling Pages needs `pages: write` and the
      # build job — which installs and runs mdBook — should not have it.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Turn Pages on if it is not already. Without this a fresh clone or a fork fails with a
          # bare "Not Found", which reads like a broken workflow rather than a setting nobody has
          # flipped yet.
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
