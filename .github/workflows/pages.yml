name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job only needs to read the repository. Deploying is what needs `pages: write` and
# OIDC, so those are granted to the deploy job alone — the build job installs and runs mdBook,
# and an install step should not also be able to publish a site.
permissions:
  contents: read

# A newer deploy always wins, but never cancel one mid-flight: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a version tag is mutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install mdBook
        run: |
          cargo install mdbook --version =0.4.52 --locked
          cargo install mdbook-mermaid --version =0.15.0 --locked

      # Drops mermaid.min.js and mermaid-init.js into book/, which book.toml references.
      - name: Install Mermaid assets
        run: mdbook-mermaid install book

      # The book includes example configurations by path. If one is renamed, the
      # build fails here rather than publishing a page with a dangling include.
      - name: Build
        run: mdbook build book

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Here rather than in the build job, because enabling Pages needs `pages: write` and the
      # build job — which installs and runs mdBook — should not have it.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Turn Pages on if it is not already. Without this a fresh clone or a fork fails with a
          # bare "Not Found", which reads like a broken workflow rather than a setting nobody has
          # flipped yet.
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
