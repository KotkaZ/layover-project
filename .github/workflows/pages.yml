name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy always wins, but never cancel one mid-flight: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install mdBook
        run: |
          cargo install mdbook --version ^0.4 --locked
          cargo install mdbook-mermaid --version ^0.15 --locked

      # Drops mermaid.min.js and mermaid-init.js into book/, which book.toml references.
      - name: Install Mermaid assets
        run: mdbook-mermaid install book

      # The book includes example configurations by path. If one is renamed, the
      # build fails here rather than publishing a page with a dangling include.
      - name: Build
        run: mdbook build book

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on if it is not already. Without this a fresh clone or a fork fails here
          # with a bare "Not Found", which reads like a broken workflow rather than a setting
          # nobody has flipped yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
