# A bill of materials for each release, signed.
#
# Not generated by `dist`: it builds and attests the binaries but does not produce a dependency
# list. This runs *after* the release build, so nothing here can fail a release — an SBOM that
# breaks a build would get switched off within a month.

name: SBOM

on:
  # `workflow_run`, not `release: published`. GitHub deliberately does not fire workflows from
  # events raised with `GITHUB_TOKEN`, and `dist` publishes the release with exactly that — so a
  # `release` trigger here would look correct and never run once.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # So the SBOM can be regenerated for a release that predates this workflow, or re-run after a
  # transient failure, without cutting a version.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach the SBOM to.
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Bill of materials
    runs-on: ubuntu-latest
    # A release build that failed has no release to attach anything to, and a `Release` run on a
    # pull request is a `dist plan` with no artifacts at all.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The tag, not the branch. An SBOM generated from `main` would describe a different
          # dependency set from the one that was actually shipped, which is worse than none:
          # it would be wrong and look authoritative.
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate
        # `--all` covers every crate in the workspace, and the lockfile is what makes the result
        # reproducible: the same tag produces the same bill.
        run: cargo cyclonedx --all --format json --spec-version 1.5

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './sbom/*' -exec cp {} sbom/ \;
          ls -la sbom
          test -n "$(ls -A sbom)"

      - name: Attest
        # The SBOM is a claim about what went into the binaries. An unsigned claim about supply
        # chain is worth very little, because anybody can write one.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: sbom/*.cdx.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" sbom/*.cdx.json --clobber
